[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-normalizer"
version = "0.1.0"
description = "Normaliza IFCs de Revit, Tekla e Civil 3D para o padrão Promon / BEP"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell",
    "ifctester",
    "ifcpatch",
    "openpyxl",
    "pandas",
    "pyyaml",
    "pywebview",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
ifc-normalizer = "ifc_normalizer.cli:main"

[project.gui-scripts]
normalizador-ifc = "ifc_normalizer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ifc_normalizer = ["gui/ui/*", "gui/ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
